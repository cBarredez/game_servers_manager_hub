# Copy this file to manager.secrets.toml and set restrictive permissions:
#   cp config/manager.secrets.example.toml config/manager.secrets.toml
#   chmod 600 config/manager.secrets.toml
#
# manager.secrets.toml is gitignored and never copied into a container image.
# Running `npm run setup` generates this file for you instead of copying by hand.

[web]
password = "change-me"
# Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
session_secret = "replace-with-a-random-64-char-hex-string"
